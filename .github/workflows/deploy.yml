name: Mise à jour BRVM → Google Drive

on:
  schedule:
    # Toutes les heures, tous les jours. Ajustez si vous voulez limiter aux
    # heures/jours de séance (ex. "0 8-18 * * 1-5" pour 8h-18h UTC, lun-ven).
    - cron: "0 * * * *"
  push:
    branches: [main]   # se relance aussi à chaque déploiement (push sur main)
  workflow_dispatch: {}   # permet de le lancer manuellement depuis l'onglet Actions

# Évite que deux exécutions se marchent dessus si un push arrive pendant un
# cycle horaire (les deux écriraient sur les mêmes fichiers Drive en même temps).
concurrency:
  group: brvm-drive-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dépendances
        run: pip install -r scripts/requirements.txt

      - name: Scrape brvm.org + mise à jour de l'historique Drive
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          DRIVE_FILE_ID_ACTIONS: ${{ secrets.DRIVE_FILE_ID_ACTIONS }}
          DRIVE_FILE_ID_OBLIGATIONS: ${{ secrets.DRIVE_FILE_ID_OBLIGATIONS }}
          DRIVE_FILE_ID_INDICES: ${{ secrets.DRIVE_FILE_ID_INDICES }}
        run: python scripts/update_drive_history.py