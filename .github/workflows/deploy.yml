name: Mise à jour quotidienne BRVM → Google Drive V2

on:
  schedule:
    # 17:15 UTC = ~17:15/18:15 heure d'Abidjan selon la saison — après la
    # clôture de séance (16h30 heure d'Abidjan). Ajustez si besoin.
    - cron: "15 17 * * 1-5"
  workflow_dispatch: {}   # permet de le lancer manuellement depuis l'onglet Actions

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dépendances
        run: pip install -r scripts/requirements.txt

      - name: Scrape brvm.org + mise à jour de l'historique Drive
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          DRIVE_FILE_ID_ACTIONS: ${{ secrets.DRIVE_FILE_ID_ACTIONS }}
          DRIVE_FILE_ID_OBLIGATIONS: ${{ secrets.DRIVE_FILE_ID_OBLIGATIONS }}
          DRIVE_FILE_ID_INDICES: ${{ secrets.DRIVE_FILE_ID_INDICES }}
        run: python scripts/update_drive_history.py